# pnpm 11 config home for this repo. ADR-0005 anchor bump (2026-10-03,
# human decision A0): the @deepseek-ai lane moved from the local upstream
# source checkout (link: overrides, never npm) to the PUBLISHED npm dists —
# the anchor dsh-v0.2.1-alpha.1 ships exact versions of every package this
# repo imports, types included (lib/types/*.d.ts ride in the tarballs). No
# overrides remain: specifiers resolve through the registry, and the typecheck
# facades (tsconfig.json / tsconfig.client.json) read the dist declarations.
# Peers install for real: the typecheck/vitest lanes import the seam packages
# directly (types + runtime JS from the dists), not just declare them.
autoInstallPeers: true
# dsh-subprocess-local's native closure (node-pty, koffi) needs postinstall
# builds; without them the dist's runtime imports fail at test time.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  koffi: true
  node-pty: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-loader@1.0.6-alpha.1'
  - '@deepseek-ai/cosmokit@1.8.6-alpha.1'
  - '@deepseek-ai/dsh-brand@0.2.1-alpha.1'
