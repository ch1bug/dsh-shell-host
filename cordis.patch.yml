# dsh-shell-host bundle patch: tools-only plugin(ADR-0013 —— 纯工具插件,
# 无执行器、无上游行接管)。
#
# 本 bundle 只以自有 id 行挂载,不接管任何上游 loader 行 id、不覆盖任何上游行
# config(ADR-0012);shell 执行器 world 已整体移除(ADR-0013),shell seam
# (ctx.shell)完全交给平台 shell 执行器。
#
# pty/terminal 两行(ADR-0007/0008 插件层 entry,与执行器维度无关):
# 挂载后模型获得单工具 shell_open(preset):按预设开出持久终端,sessionId 即
# PTY 缝会话 id,后续操作复用既有 pty_send/pty_tail/pty_close(不加转发工具)。
# 独立 settings namespace(id: terminal)。【2026-10-10 撤下→#61 恢复】
# ADR-0010 改道自带通道后 ./pty 不再 inject terminals,会话核心由 node-pty
# (Windows ConPTY)自管;两行恢复随 bundle 挂载,无依赖等待。
#
# #136:ssh 家族独立成 ./ssh(pty 回归纯会话核心)。
# #137:远程工作区 ./remote(工作区登记 + 每主机一条长驻通道)与它的文件姐妹
# ./remote-fs(ctx.remoteFs + remote_ls,ADR-0016 决策 1)。remote-fs 的
# inject 含 remote,故 remote 行必须先于 remote-fs 行(顺序即依赖)。
# #143(对 #134「刻意不挂」的改判):./wsl 随 bundle 挂载但默认关闭 ——
# disabled: true 的行留在 loader 树上(插件面可见、可开启),disabled 条目不激活
# 插件、不去解析 inject,故默认零开销;用户侧把该行 disabled 置 false 后重启
# 即注册 win_* 七个 Windows 互操作工具。形状守卫:tests/patch-shape.spec.ts
# (行 id 棘轮 + wsl 行必须 disabled: true 的断言)。
- insert:
    - id: pty
      name: dsh-shell-host/pty
- insert:
    - id: ssh
      name: dsh-shell-host/ssh
- insert:
    - id: terminal
      name: dsh-shell-host/terminal
      config:
        custom: []
- insert:
    - id: remote
      name: dsh-shell-host/remote
- insert:
    - id: remote-fs
      name: dsh-shell-host/remote-fs
- insert:
    - id: wsl
      name: dsh-shell-host/wsl
      disabled: true