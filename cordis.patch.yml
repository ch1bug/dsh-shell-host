# dsh-bash-msys bundle patch: one additive agent preset (`Native MSYS2 Bash`).
#
# Inserted whole over the profile root (the package's `dsh.bundle.patch`
# field), so it contributes rows and never reconfigures or disables a row
# another bundle owns — the same discipline as the dsh-bash-native patch:
# the host plane and every other preset (including the ones using `pwsh`)
# stay untouched, and `agent-preset-registry` is never written here.
#
# The row set mirrors the dsh-bash-native full preset demonstration (spec D5):
# persona + agent-instructions, one `isolate: { shell, terminals }` group
# carrying this bundle's executor and the terminal pair, the bash tool (with
# the persistent alternative present but disabled), file/search/job/skill/goal
# tools, and the plan/compaction/delegation groups.
- insert:
    - id: preset-bash-msys
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: bash-msys
        name: Native MSYS2 Bash
        description: A real MSYS2 (UCRT64) bash on Windows — pacman, cygpath, /c/ paths and the full /usr/bin toolchain for both the model's bash tool and the session terminal panel, with background jobs and spill-backed output.
        order: 7
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model.
              suffix: |-
                Your working directory is {{cwd}}. The bash tool and the terminal panel run a real MSYS2 bash (UCRT64): POSIX paths (/c/...), pacman and cygpath are available; use bash syntax, not PowerShell.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # The shell group isolates `shell` and `terminals`, so this preset's
          # executor is the realm's executor: the host plane keeps its own
          # provider for every other preset.
          - id: bash-msys-shell
            name: cordis:group
            group: true
            isolate:
              shell: true
              terminals: true
            config:
              - id: bash-msys
                name: dsh-bash-msys
                config:
                  backend: msys2
              - id: bash-msys-terminal
                name: '@deepseek-ai/dsh-terminal'
              # `inject: [shell]` delays this row until the realm's executor
              # exists, so the expressions below can read the resolved engine.
              # `--login -i` (engineArgs) makes /etc/profile build the MSYS
              # environment interactively; CHERE_INVOKING (executor env seam)
              # keeps the working directory across it.
              # Loud, not silent: no `?? ''`/`?? []` fallback — an unresolvable
              # shell realm fails the row instead of letting dsh-terminal-bash
              # quietly start its own default shell (ADR-0001 T4 amendment §2).
              - id: bash-msys-terminal-pty
                name: '@deepseek-ai/dsh-terminal-bash'
                inject: [shell]
                config:
                  backendType: shell
                  shellDialect: bash
                  shellPath: !!js (() => { const p = ctx.get('shell')?.enginePath; if (!p) throw new Error('bash-msys resolved no enginePath; the PTY row cannot start'); return p; })()
                  shellArgs: !!js (() => { const a = ctx.get('shell')?.engineArgs; if (!a) throw new Error('bash-msys resolved no engineArgs; the PTY row cannot start'); return a; })()
                  timeoutMs: 300000
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
              # Stateful alternative to `tool-bash`: both register the tool
              # name `bash`, so exactly one of the two may be enabled.
              - id: bash-msys-persistent
                name: '@deepseek-ai/dsh-tool-bash-persistent'
                disabled: true
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a persistent bash shell
                    * State is persistent across command calls and discussions with the user.
                    * This is a bash (POSIX) shell on Windows, not PowerShell; use bash syntax and POSIX paths.
                    * Please avoid commands that may produce a very large amount of output.
                    * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
