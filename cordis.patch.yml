# dsh-bash-msys bundle patch: Windows 宿主级 shell 替换(MSYS2 平台层)。
#
# 建模立场:MSYS2 是独立于 bash 的环境层——安装根(msysRoot)、子系统(MSYSTEM)、
# PATH 表面、pacman/cygpath 工具链是一等公民;bash 只是该环境中可配置的 shell
# 可执行文件。执行器内部按 VS Code 终端 profile 建模(ordered candidates、
# argv 模板、profile env、CHERE_INVOKING、addEnvMixinPathPrefix)。
#
# 替换语义:shell seam(`ctx.shell`)每个 composition 只允许恰好一个 provider,
# 且「装载即生效于所有 preset」——preset 树里的 `tool-bash` 行解析宿主平面的
# ctx.shell,不复制执行器。因此本 patch 在宿主平面完全取代 base bundle 的平台
# shell 执行器:每个 preset(Matt 工作流、bash 演示、未来任何 bash-dialect
# preset)的 bash 工具、enginePath/engineArgs 终端推导、configForms namespace
# 都自动落到本执行器上;对外接口(bash 工具 schema、jobs、spill、退出标记)
# 与 @deepseek-ai/dsh-bash-local 逐字段一致 —— 本包就是它的 fork。
#
# base 的 win32 挂载:bash-sandbox disabled / pwsh-sandbox enabled。这里:
#   1) 禁用 pwsh-sandbox —— Windows 平台 shell 角色由 MSYS2 承担;
#   2) 重申 bash-sandbox 的 win32 禁用(防 base 语义翻转,POSIX 不受影响);
#   3) 插入本执行器(id: bash-msys)。POSIX 上所有行休眠(平台守卫)。
#   所有 override 行带 name: 守卫(loader 校验语义:name 不匹配 → 该 op
#   被跳过):基座若改名,这里是响亮失败,而不是把配置写进顶替该 id 的无关行。
#
# 已知取舍(shipped preset 兼容性):web-app 的 standard/minimal preset 在
# win32 上启用 `pwsh` 工具,本替换后其命令文本会交给 bash(无方言翻译,
# 上游契约即如此)。本部署请使用 bash-dialect preset(Matt 工作流即默认)。
- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform === 'win32'
- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
- insert:
    - id: bash-msys
      name: dsh-bash-msys
      disabled: !!js process.platform !== 'win32'
      config:
        backend: msys2
        subsystem: UCRT64

# #10: D8 副作用修复 —— 上游 permission-presets 组装硬检查
# ctx.shell.sandboxMode === undefined 即 throw(非 confinement 执行器 = 
# misconfiguration),宿主服务起不来 → client 行 inject remote.permissionPresets
# 落空 → /permission 命令、设置页 PermissionRow、输入框权限选择器三面全灭。
# 路径已拍板(human 2026-09-30):包内 host-only fork,不提上游。
# fork = 本包 ./permission-presets 入口:同名服务(permissionPresets)+
# 同 Typert 命名空间 + 同命令 definitionId(@deepseek-ai/dsh-permission-presets),
# 原版 client UI 零改动复活。fork 的 sandbox 旋钮回退读 ctx.sandboxPolicy
# (文件沙箱政策,与执行器无关)——不读 ctx.shell,不声称进程 confinement。
# 挂载形状沿用既有纪律:禁用基座行(win32 + name: 守卫)+ insert 本包 fork 行;
# POSIX 上 fork 行休眠,基座行照常组装(confining base executor)。
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  disabled: !!js process.platform === 'win32'
- insert:
    - id: permission-msys
      name: dsh-bash-msys/permission-presets
      disabled: !!js process.platform !== 'win32'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

# 用户侧边栏终端(api-terminal-controller)是宿主级 user terminal,与 preset
# 无关:发现走宿主 PATH。本机 Windows PATH 不含 MSYS2,裸 `bash` 只会命中
# C:\Windows\System32\bash.exe(WSL 启动器 stub)。这里把 MSYS2 bash 显式设为
# 默认 shell(`--login -i`,VS Code `bash (MSYS2)` profile 同款,登录脚本在
# 纯 MSYS 子系统下构建环境),并从候选中摘掉裸 `bash` 防误选 stub。
# 行内 !!js 探测安装位置:未安装时不产出 profile(schema 接受 undefined),
# 候选表保持上游默认 —— 与执行器 detect.ts 同一候选顺序。
- id: terminal-controller
  name: '@deepseek-ai/dsh-api-terminal-controller'
  config:
    shell: !!js >-
      (() => { const fs = process.getBuiltinModule('node:fs'); const path = ['C:/msys64/usr/bin/bash.exe', `${process.env.HOMEDRIVE ?? 'C:'}/msys64/usr/bin/bash.exe`].find(p => fs.existsSync(p)); return path === undefined ? undefined : { path, name: 'MSYS2 Bash', args: ['--login', '-i'] }; })()
    shellCandidates: !!js >-
      (() => { const fs = process.getBuiltinModule('node:fs'); const msys = ['C:/msys64/usr/bin/bash.exe', `${process.env.HOMEDRIVE ?? 'C:'}/msys64/usr/bin/bash.exe`].some(p => fs.existsSync(p)); return ['zsh', 'bash', 'fish', 'pwsh', 'powershell', 'cmd'].filter(c => c !== 'bash' || !msys); })()
